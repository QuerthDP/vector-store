name: run-validator-tests

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system for the build'
        required: true
        type: string
      arch:
        description: 'Architecture for the build'
        required: true
        type: string
      testcase:
        description: 'Test case to run'
        required: true
        type: string
      ref:
        description: 'Git reference to build from'
        required: true
        type: string
      gpu:
        description: 'Build and run Vector Store with cuVS on the GPU runner'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run-validator-tests:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.gpu && 60 || 360 }}

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        sparse-checkout: ${{ !inputs.gpu && 'scripts/run-validator-with-scylla-docker' || '' }}
        sparse-checkout-cone-mode: false
        clean: ${{ !inputs.gpu }}
        ref: ${{ inputs.ref }}

    - name: Download scylla-nightly digest artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: scylla-nightly-digest

    - name: Download vector-store artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: vector-store-${{inputs.arch}}${{ inputs.gpu && '-gpu' || '' }}

    - name: Download vector-search-validator artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: vector-search-validator-${{inputs.arch}}

    - name: Chmod a+x downloaded artifacts
      run: chmod a+x vector-store vector-search-validator

    - name: Setup cuVS
      if: inputs.gpu
      run: scripts/setup-gpu --github-env
      env:
        VECTOR_STORE_CUVS_GPU_PREFIX: ${{ runner.tool_cache }}/vector-store-cuvs-gpu

    - name: Run the Validator tests for testcase ${{inputs.testcase}}
      if: ${{ !inputs.gpu }}
      env:
        testcase: ${{inputs.testcase}}
      run: |
        ./scripts/run-validator-with-scylla-docker scylladb/scylla-nightly@$(cat scylla-nightly-digest) vector-store vector-search-validator "\"${testcase}\"::" --verbose

    - name: Name the Validator container
      if: inputs.gpu
      env:
        testcase: ${{inputs.testcase}}
      run: echo "VALIDATOR_CONTAINER=validator-${{ github.run_id }}-${{ github.run_attempt }}-${testcase//[^a-zA-Z0-9_.-]/_}" >> "$GITHUB_ENV"

    - name: Run the Validator tests on the GPU for testcase ${{inputs.testcase}}
      if: inputs.gpu
      env:
        testcase: ${{inputs.testcase}}
        VECTOR_STORE_CUVS_GPU_PREFIX: ${{ runner.tool_cache }}/vector-store-cuvs-gpu
        VECTOR_STORE_CUVS_BUILD_INTERVAL: 1s
      run: |
        ./scripts/run-validator-with-scylla-docker --gpu "$VECTOR_STORE_CUVS_GPU_PREFIX" scylladb/scylla-nightly@$(cat scylla-nightly-digest) vector-store vector-search-validator "\"${testcase}\"::" --verbose

    # Cancelling the job does not stop the container.
    - name: Remove the Validator container
      if: always() && inputs.gpu && env.VALIDATOR_CONTAINER
      run: docker rm -f "$VALIDATOR_CONTAINER" || true
